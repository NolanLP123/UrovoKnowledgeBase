<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Urovo USDK API quick reference.">
  <meta name="theme-color" content="#0b1220">
  <title>Urovo USDK Knowledge Base</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="manual-page">
  <header class="manual-hero">
    <div class="manual-shell">
      <div class="manual-brand-row">
        <a class="manual-brand" href="index.html">
          <span class="manual-logo">U</span>
          <span><strong>Urovo USDK Knowledge Base</strong><small>USDK Interface Quick Reference</small></span>
        </a>
        <span class="version-pill">V15.5.01E</span>
      </div>
      <div class="manual-stats">
        <span><b id="entry-total">395</b> APIs</span>
        <span><b>4</b> modules</span>
        <span>Static · Shareable</span>
      </div>
    </div>
  </header>

  <main>
    <section class="manual-controls">
      <div class="manual-shell">
        <label class="manual-search" for="manual-search-input">
          <span>Search</span>
          <input id="manual-search-input" type="search" placeholder="API name, signature, description…" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div class="module-chips" id="module-chips" aria-label="Filter by module">
          <button class="module-chip active" type="button" data-module="">All APIs</button>
        </div>
        <div class="manual-result-row">
          <span id="manual-result-count">Loading interfaces…</span>
          <button id="reset-manual-filters" type="button">Reset filters</button>
        </div>
      </div>
    </section>

    <section class="manual-content">
      <div class="manual-shell">
        <div class="api-card-grid" id="api-card-grid"></div>
        <div class="manual-empty" id="manual-empty" hidden>
          <strong>No matching API</strong>
          <span>Try another keyword or module.</span>
        </div>
        <button class="load-more" id="load-more" type="button" hidden>Load more APIs</button>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
